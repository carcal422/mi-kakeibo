<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111318">
<meta name="description" content="Mi Kakeibo: control de gastos con el método japonés, 100 % sin internet y sin anuncios.">
<title>Mi Kakeibo</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{--bg:#f3f4f7;--card:#fff;--card2:#f7f8fa;--tx:#1b1d24;--mut:#6b7080;--line:#e3e5eb;--acc:#2a9a6c;--accT:#fff;--acc2:#e3f4ec;--bad:#d94b4b;--warn:#d99023;--ok:#2a9a6c;--r:18px;--sh:0 1px 3px rgba(0,0,0,.06)}
[data-theme=dark]{--bg:#111318;--card:#1b1e26;--card2:#22262f;--tx:#eceef3;--mut:#9aa0ae;--line:#2c303b;--acc:#46c08d;--accT:#0d1a14;--acc2:#1b3128;--bad:#ff6b6b;--warn:#f2b04f;--ok:#46c08d;--sh:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(90px + env(safe-area-inset-bottom));overscroll-behavior-y:contain}
button,input,select,textarea{font:inherit;color:inherit}
h2{font-size:1.3rem;margin:0}h3{font-size:1.05rem;margin:0 0 8px}
p{margin:6px 0}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(12px + env(safe-area-inset-top)) 14px 8px;display:flex;align-items:center;gap:10px;max-width:560px;margin:0 auto}
.top h1{font-size:1.2rem;margin:0;flex:1}
.ib{background:var(--card);border:1px solid var(--line);border-radius:12px;width:40px;height:40px;display:grid;place-items:center;font-size:1.1rem;cursor:pointer}
.mnav{display:flex;align-items:center;justify-content:space-between;margin:4px 0 12px}
.mnav b{text-transform:capitalize;font-size:1.05rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.card.hi{border-color:var(--acc);background:var(--acc2)}
.card.warn{border-color:var(--warn)}
.mut{color:var(--mut)}.sm{font-size:.85rem}.xs{font-size:.75rem}
.big{font-size:2.1rem;font-weight:800;letter-spacing:-.5px;margin:2px 0 8px}
.neg{color:var(--bad)}.pos{color:var(--ok)}
.bar{height:10px;background:var(--card2);border-radius:99px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;border-radius:99px;transition:width .4s}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.kpis div{background:var(--card2);border-radius:12px;padding:8px}
.kpis span{display:block;font-size:.72rem;color:var(--mut)}.kpis b{font-size:.84rem;white-space:nowrap;letter-spacing:-.2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.btn{background:var(--acc);color:var(--accT);border:0;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--acc);border:1.5px solid var(--acc)}
.btn.bad{background:var(--bad);color:#fff}
.btn.full{width:100%}
.btn.sm{padding:7px 12px;font-size:.85rem;border-radius:10px}
.link{background:none;border:0;color:var(--acc);font-weight:700;cursor:pointer;padding:4px 0}
.cat{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.cat:last-child{border-bottom:0}
.dot{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:1.15rem;flex:none}
.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.tx:last-child{border-bottom:0}
.amt{font-weight:700;white-space:nowrap}
.day{display:flex;justify-content:space-between;font-size:.8rem;color:var(--mut);margin:14px 4px 4px;text-transform:capitalize}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:7px 12px;font-size:.88rem;cursor:pointer;white-space:nowrap}
.chip.on{border-color:var(--acc);background:var(--acc2);color:var(--tx);font-weight:700}
.chip:has(input:checked){border-color:var(--acc);background:var(--acc2)}
.chip .x{margin-left:6px;opacity:.6}
input.f,select.f,textarea.f{width:100%;background:var(--card2);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;outline:none}
input.f:focus,select.f:focus,textarea.f:focus{border-color:var(--acc)}
textarea.f{min-height:80px;resize:vertical}
label.l{display:block;font-size:.8rem;color:var(--mut);margin:12px 0 5px;font-weight:600}
.money{font-size:2rem;font-weight:800;text-align:center;letter-spacing:-.5px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--card2);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:9px;padding:9px;font-weight:700;cursor:pointer;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.cats4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cats4 button{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:9px 2px;cursor:pointer;font-size:.72rem;line-height:1.15}
.cats4 button span{display:block;font-size:1.4rem;margin-bottom:3px}
.cats4 button.on{border-width:2px}
nav.bot{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
nav.bot button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;color:var(--mut);padding:4px 0;cursor:pointer}
nav.bot button i{font-style:normal;font-size:1.3rem}
nav.bot button.on{color:var(--acc);font-weight:700}
nav.bot .fab{width:58px;height:58px;border-radius:20px;background:var(--acc);color:var(--accT);font-size:2rem;margin:-26px auto 0;display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.25);border:0;cursor:pointer}
#modal .bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fd .15s}
#modal .sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom));animation:up .2s}
#modal .grab{width:40px;height:5px;background:var(--line);border-radius:9px;margin:0 auto 10px}
@keyframes up{from{transform:translateY(40px);opacity:.5}}@keyframes fd{from{opacity:0}}
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.9rem;z-index:40;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw;text-align:center}
#toast.show{opacity:1}
.donutw{position:relative;width:170px;height:170px;margin:0 auto}
.donutw .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin-top:12px;font-size:.85rem}
.legend span{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.menu button{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:13px 2px;text-align:left;cursor:pointer}
.menu button:last-child{border-bottom:0}
.menu button i{font-style:normal;font-size:1.3rem;width:30px;text-align:center}
.menu button .grow b{display:block}
.pill{display:inline-block;font-size:.7rem;padding:2px 8px;border-radius:99px;background:var(--card2);color:var(--mut);font-weight:700}
.pill.ok{background:var(--acc2);color:var(--acc)}.pill.warn{color:var(--warn)}
.empty{text-align:center;color:var(--mut);padding:24px 8px}
.empty i{font-style:normal;font-size:2.4rem;display:block;margin-bottom:6px}
table.t{width:100%;border-collapse:collapse;font-size:.85rem}
table.t th,table.t td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t th{color:var(--mut);font-weight:600;font-size:.75rem}
.lock{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.pins{display:flex;gap:14px}.pins b{width:16px;height:16px;border-radius:50%;border:2px solid var(--mut)}.pins b.on{background:var(--acc);border-color:var(--acc)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px}
.pad button{height:72px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:1.5rem;cursor:pointer}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.li{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.del{background:none;border:0;color:var(--mut);font-size:1.1rem;cursor:pointer;padding:4px 6px}
.check{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:none;cursor:pointer;display:grid;place-items:center;font-size:.85rem;flex:none}
.check.on{background:var(--acc);border-color:var(--acc);color:var(--accT)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.goal .bar{height:12px}
svg text{fill:var(--mut);font-size:9px}
.q{font-weight:700;margin-top:14px}
.ovlx{opacity:0;animation:ovlIn .3s 4s forwards}@keyframes ovlIn{to{opacity:1}}
.upbar{position:fixed;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top));z-index:45;background:var(--acc);color:var(--accT);border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.cards{display:flex;gap:10px;overflow-x:auto;padding:2px 14px 10px;margin:0 -14px;scrollbar-width:none}
.cards::-webkit-scrollbar{display:none}
.acard{flex:none;width:205px;height:122px;border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.18);overflow:hidden}
.acard.big{width:100%;height:150px;margin-bottom:12px}
.acard.add{background:var(--card);border:2px dashed var(--line);color:var(--mut);align-items:center;justify-content:center;box-shadow:none;width:100px}
.cbal{font-size:1.3rem;font-weight:800;letter-spacing:-.3px}.acard.big .cbal{font-size:1.7rem}
.banks{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.bank{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:9px 7px;font-size:.74rem;cursor:pointer;display:flex;align-items:center;gap:6px;text-align:left;line-height:1.15}
.bank i{width:14px;height:14px;border-radius:50%;flex:none}
.bank.on{border-color:var(--acc);background:var(--acc2);font-weight:700}
.bdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.cats3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.cats3 button{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:8px 2px;cursor:pointer;font-size:.74rem;line-height:1.15}
.cats3 button span{display:block;font-size:1.3rem;margin-bottom:2px}
.seg3{grid-template-columns:1fr 1fr 1fr}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0 0 12px}
.qa button{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:9px 2px;cursor:pointer;font-size:.72rem;line-height:1.15;color:var(--tx)}
.qa button span{display:block;font-size:1.25rem;margin-bottom:3px}
.qa.q3{grid-template-columns:repeat(3,1fr)}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>
<input type="file" id="fileIn" accept="application/json,.json" hidden>
<script src="config.js"></script>
<script>
'use strict';
/* =========================================================
   Mi Kakeibo · versión 1
   Todo se guarda solo en este dispositivo (localStorage).
   ========================================================= */
const KEY = 'mikakeibo.v1';
const APP_VERSION = '8.5.0';
const TOUR=[
  {e:'👋',t:'Bienvenido a Mi Kakeibo',p:'Es el método japonés para controlar la plata: anotar cada gasto, darte cuenta en qué se va y decidir mejor. Sin anuncios y funciona sin internet.'},
  {e:'🗓️',t:'1. Planea',p:'Escribe tus gastos fijos (arriendo, servicios…) y cuánto quieres ahorrar. ¿Te pagan cada 15 días? Activa <b>Quincenal</b> en Más › Ajustes y anota cada pago apenas llegue.'},
  {e:'➕',t:'2. Anota cada gasto',p:'Toca el botón verde <b>+</b>, escribe el monto y elige uno de los 4 pilares: 🏠 Supervivencia, 🎉 Ocio, 📚 Cultura o ⚡ Extras. Marca si lo necesitabas, lo querías o fue un impulso.'},
  {e:'💳',t:'3. Tus cuentas y tarjetas',p:'Agrega Nequi, tu banco, tu tarjeta de crédito y el efectivo. Al anotar un gasto eliges con qué pagaste y el saldo se descuenta solo. Pasar plata entre cuentas no cuenta como gasto.'},
  {e:'😌',t:'4. Mira cuánto puedes gastar hoy',p:'En Inicio verás <b>"Hoy puedes gastar"</b> y si vas bien con el ritmo del mes. Al final del mes, haz la reflexión con las 4 preguntas.'},
  {e:'☁️',t:'5. Respaldo y espacio compartido',p:'En <b>Más › Ajustes</b> conecta tu Google Drive para no perder nada. En <b>Más › Espacios compartidos</b> pueden crear "Casa" para la plata que manejan en pareja.'}
];
const CATS = [
  {id:'sup', name:'Supervivencia', emoji:'🏠', color:'#2fa874', desc:'Lo necesario: mercado, transporte, servicios, salud'},
  {id:'oci', name:'Ocio y vicios', emoji:'🎉', color:'#ef8d3c', desc:'Salidas, comida fuera, juegos, antojos'},
  {id:'cul', name:'Cultura', emoji:'📚', color:'#4a8fe0', desc:'Cursos, libros, cine, música, apps'},
  {id:'ext', name:'Extras', emoji:'⚡', color:'#a06be6', desc:'Imprevistos, regalos, reparaciones, ropa'}
];
const DEFAULT_SUBS = {
  sup:['Mercado','Transporte','Servicios','Salud','Arriendo','Aseo','Celular/Internet'],
  oci:['Comida fuera','Salidas','Juegos','Antojos','Suscripciones'],
  cul:['Cursos','Libros','Cine','Música','Software'],
  ext:['Imprevistos','Regalos','Reparaciones','Ropa','Otros']
};
const MOODS = [
  {id:'nec', name:'Lo necesitaba', emoji:'✅'},
  {id:'que', name:'Lo quería', emoji:'🙂'},
  {id:'imp', name:'Fue impulso', emoji:'⚡'}
];
const MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const WDAYS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const GOAL_EMOJIS = ['🎯','💻','🏍️','✈️','🏠','🎓','🛡️','🎮','📱','🎁'];

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,'0');
const dstr = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayStr = () => dstr(new Date());
const ymOf = ds => ds.slice(0,7);
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const sum = (arr, k='amount') => arr.reduce((a,x)=>a+(Number(x[k])||0),0);
const fmt = n => (Math.round(n)<0?'-':'')+'$\u00a0'+Math.round(Math.abs(n)).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const fmtIn = n => n ? Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.') : '';
const parseAmt = v => Number(String(v||'').replace(/\D/g,''))||0;
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymParts = ym => ym.split('-').map(Number);
const daysIn = ym => { const [y,m]=ymParts(ym); return new Date(y,m,0).getDate(); };
const monthName = ym => { const [y,m]=ymParts(ym); return MONTHS[m-1]+' '+y; };
const monthShort = ym => { const [y,m]=ymParts(ym); return MONTHS[m-1].slice(0,3); };
const addMonth = (ym,k) => { let [y,m]=ymParts(ym); m+=k; while(m>12){m-=12;y++} while(m<1){m+=12;y--} return y+'-'+pad(m); };
const parseD = ds => { const [y,m,d]=ds.split('-').map(Number); return new Date(y,m-1,d); };
const daysBetween = (a,b) => Math.round((parseD(b)-parseD(a))/86400000);
const catById = id => CATS.find(c=>c.id===id) || CATS[3];
const moodById = id => MOODS.find(m=>m.id===id);
const pctColor = p => p>=100?'var(--bad)':p>=85?'var(--warn)':'var(--acc)';
function dayLabel(ds){
  const t=todayStr(), diff=daysBetween(ds,t);
  if(diff===0) return 'Hoy';
  if(diff===1) return 'Ayer';
  const d=parseD(ds); return WDAYS[d.getDay()]+' '+d.getDate()+' de '+MONTHS[d.getMonth()];
}
function hash(s){ // candado básico (no es cifrado)
  let h=2166136261; s='mk#'+s;
  for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); }
  return (h>>>0).toString(36);
}

/* ---------- estado ---------- */
function defState(){
  return {v:1, created:todayStr(),
    settings:{theme:'auto', pin:null, wishDays:30, autoDrive:true, payMode:'m', payBase:0, saveMode:'pct', saveVal:10, subs:JSON.parse(JSON.stringify(DEFAULT_SUBS)), lastBackup:null},
    months:{}, tx:[], goals:[], wishes:[], accounts:[], del:{}};
}
function migrate(s){
  const d=defState();
  s.settings=Object.assign(d.settings, s.settings||{});
  s.settings.subs=s.settings.subs||{};
  for(const c of CATS) if(!Array.isArray(s.settings.subs[c.id])) s.settings.subs[c.id]=[...DEFAULT_SUBS[c.id]];
  s.months=s.months||{}; s.tx=Array.isArray(s.tx)?s.tx:[]; s.goals=s.goals||[]; s.wishes=s.wishes||[]; s.del=(s.del&&typeof s.del==='object')?s.del:{}; s.accounts=Array.isArray(s.accounts)?s.accounts:[];
  s.v=1; return s;
}
/* Almacenamiento: los movimientos se guardan por año (mikakeibo.v1.tx.2026…) y el resto en
   mikakeibo.v1.meta. Así, al anotar un gasto solo se reescribe el año que cambió. */
const META_KEY = KEY+'.meta', TX_KEY = y => KEY+'.tx.'+y;
let storedYears = null, dataVer = 0;
function load(){
  try{
    const meta=localStorage.getItem(META_KEY);
    if(meta){
      const s=JSON.parse(meta), years=s._years||[]; delete s._years; s.tx=[];
      for(const y of years){ const r=localStorage.getItem(TX_KEY(y)); if(r){ const arr=JSON.parse(r); for(let i=0;i<arr.length;i++) s.tx.push(arr[i]); } }
      storedYears=new Set(years); return migrate(s);
    }
    const r=localStorage.getItem(KEY); if(r) return migrate(JSON.parse(r)); // formato anterior: se convierte al guardar
  }catch(e){ console.error(e); }
  return defState();
}
let S = load();
/* Cada registro lleva "u" (momento del último cambio) y los borrados quedan anotados en S.del.
   Así se pueden mezclar los datos de varios dispositivos sin perder nada. */
function recordsOf(s){
  const r=[];
  s.tx.forEach(o=>r.push(['t:'+o.id,o])); s.goals.forEach(o=>r.push(['g:'+o.id,o])); s.wishes.forEach(o=>r.push(['w:'+o.id,o])); s.accounts.forEach(o=>r.push(['a:'+o.id,o]));
  for(const k in s.months) r.push(['m:'+k,s.months[k]]);
  r.push(['s:',s.settings]); return r;
}
const NOSIG={u:1,pin:1,lastBackup:1};
function sig(o){
  if(o.pin!==undefined || o.lastBackup!==undefined) return JSON.stringify(o,(k,v)=>NOSIG[k]?undefined:v);
  const {u,...r}=o; return JSON.stringify(r); // rápido: sin función de reemplazo
}
// Los movimientos NUNCA se modifican en sitio (al editar se reemplaza el objeto completo),
// así que su firma se puede recordar y no recalcular en cada guardado.
const txSig=new WeakMap();
function sigTx(o){ let v=txSig.get(o); if(v===undefined){ v=sig(o); txSig.set(o,v); } return v; }
let prevYears = new Map();
function buildMap(s){
  const m=new Map(); prevYears=new Map();
  for(const [k,o] of recordsOf(s)){ const isTx=k[0]==='t'&&k[1]===':'; m.set(k,isTx?sigTx(o):sig(o)); if(isTx) prevYears.set(k,(o.date||'').slice(0,4)); }
  return m;
}
let prevMap = buildMap(S);
function stamp(){
  const now=Date.now(), cur=new Map(), years=new Set(), ny=new Map(); let changed=false;
  for(const [k,o] of recordsOf(S)){
    const isTx=k[0]==='t'&&k[1]===':', j=isTx?sigTx(o):sig(o); cur.set(k,j);
    if(isTx) ny.set(k,(o.date||'').slice(0,4));
    if(prevMap.get(k)!==j){ o.u=now; delete S.del[k]; changed=true; if(isTx){ years.add((o.date||'').slice(0,4)); if(prevYears.has(k)) years.add(prevYears.get(k)); } }
  }
  for(const k of prevMap.keys()) if(!cur.has(k)){ S.del[k]=now; changed=true; if(prevYears.has(k)) years.add(prevYears.get(k)); }
  prevMap=cur; prevYears=ny; return {changed, years};
}
// years: Set de años a reescribir (vacío = solo lo general). Sin argumento = todo.
function persist(years){
  dataVer++;
  try{
    const full=!years || storedYears===null;
    // Pasar del formato anterior: se libera ese espacio primero (queda una copia en memoria por si algo falla)
    let legacy=null; if(storedYears===null){ legacy=localStorage.getItem(KEY); if(legacy!==null) localStorage.removeItem(KEY); }
    try{
    const byYear={};
    if(full){ for(const t of S.tx){ const y=(t.date||'').slice(0,4); (byYear[y]=byYear[y]||[]).push(t); } }
    else if(years.size){ for(const y of years) byYear[y]=[]; for(const t of S.tx){ const y=(t.date||'').slice(0,4); if(years.has(y)) byYear[y].push(t); } }
    const keep=new Set(full?[]:(storedYears||[]));
    for(const y in byYear){ if(byYear[y].length){ localStorage.setItem(TX_KEY(y),JSON.stringify(byYear[y])); keep.add(y); } else { localStorage.removeItem(TX_KEY(y)); keep.delete(y); } }
    if(full) for(const y of (storedYears||[])) if(!keep.has(y)) localStorage.removeItem(TX_KEY(y));
    const {tx,...meta}=S; meta._years=[...keep].sort();
    localStorage.setItem(META_KEY, JSON.stringify(meta));
    storedYears=keep;
    }catch(e){ if(legacy!==null){ try{ localStorage.setItem(KEY,legacy); }catch(_){} } throw e; }
  }catch(e){ toast('⚠️ No se pudo guardar: '+e.message+'. Haz un respaldo en Más › Ajustes.'); }
}
function save(){ const r=stamp(); persist(r.years); if(r.changed && typeof Sync!=='undefined') Sync.changed(); }
// Resultados guardados en memoria hasta el próximo cambio (para que las pantallas abran rápido)
const memo={v:-1,m:null};
function mget(k,fn){ if(memo.v!==dataVer){ memo.v=dataVer; memo.m=new Map(); } if(!memo.m.has(k)) memo.m.set(k,fn()); return memo.m.get(k); }
function txOfMonth(ym){
  return mget('idx',()=>{ const m=new Map(); for(const t of S.tx){ const k=(t.date||'').slice(0,7); let a=m.get(k); if(!a) m.set(k,a=[]); a.push(t); } return m; }).get(ym)||[];
}
function M(ym){
  if(!S.months[ym]) S.months[ym]={income:[], fixed:[], saving:0, budgets:{sup:0,oci:0,cul:0,ext:0}, refl:{a:'',b:'',c:'',d:''}, setup:false, closed:false};
  const m=S.months[ym]; m.budgets=m.budgets||{sup:0,oci:0,cul:0,ext:0}; m.refl=m.refl||{a:'',b:'',c:'',d:''};
  return m;
}
function stats(ym){ M(ym); return mget('st:'+ym,()=>statsRaw(ym)); }
function statsRaw(ym){
  const m=M(ym);
  const tx=txOfMonth(ym);
  const gastos=tx.filter(isOut), extraIn=tx.filter(t=>t.type==='in');
  const qp=isQ()?paysOf(ym+'-1').concat(paysOf(ym+'-2')).filter(t=>!t.start):null;
  const ingFix=qp?sum(qp):sum(m.income), ingExtra=sum(extraIn), ing=ingFix+ingExtra;
  const fijos=sum(m.fixed), ahorro=qp?sum(qp,'save')+sum(sobOf(ym+'-1').concat(sobOf(ym+'-2'))):(Number(m.saving)||0);
  const disp=ing-fijos-ahorro, gastado=sum(gastos);
  const byCat={}; CATS.forEach(c=>byCat[c.id]=0);
  gastos.forEach(t=>byCat[t.cat]=(byCat[t.cat]||0)+t.amount);
  const byMood={nec:0,que:0,imp:0}; gastos.forEach(t=>{ if(t.mood) byMood[t.mood]+=t.amount; });
  return {m,tx,gastos,ing,ingFix,ingExtra,fijos,ahorro,disp,gastado,restante:disp-gastado,byCat,byMood,ahorroReal:ing-fijos-gastado};
}

/* =========================================================
   ESPACIOS COMPARTIDOS (ej: "Casa")
   - Es un archivo en el Drive de quien lo crea, compartido con la pareja.
   - Cada uno lo tiene también en su celular: funciona sin internet y se mezcla al sincronizar.
   - Fondo = aportes − gastos pagados con el fondo − devoluciones.
   - "Lo pagué de mi bolsillo" = la casa le debe esa plata a esa persona.
   ========================================================= */
const SPACES_KEY='mikakeibo.spaces';
const SP_CATS=[
  {id:'mer',n:'Mercado',e:'🛒',c:'#2fa874'}, {id:'ser',n:'Servicios',e:'💡',c:'#e9a23b'}, {id:'arr',n:'Arriendo',e:'🏠',c:'#4a8fe0'},
  {id:'ase',n:'Aseo',e:'🧽',c:'#3bb7c4'}, {id:'rep',n:'Arreglos',e:'🔧',c:'#8a7f72'}, {id:'hog',n:'Hogar y muebles',e:'🛋️',c:'#a06be6'},
  {id:'mas',n:'Mascotas',e:'🐾',c:'#d9774b'}, {id:'sal',n:'Planes juntos',e:'🍿',c:'#e0577d'}, {id:'otr',n:'Otros',e:'📦',c:'#6b7080'}
];
const SP_EMOJIS=['🏠','💑','🛒','✈️','🐾','🎉','👨‍👩‍👧','💰'];
const spCat=id=>SP_CATS.find(c=>c.id===id)||SP_CATS[SP_CATS.length-1];
function spMigrate(d){
  d=d&&typeof d==='object'?d:{};
  d.meta=d.meta||{name:'Casa',emoji:'🏠'}; d.meta.members=Array.isArray(d.meta.members)?d.meta.members:[]; d.meta.split=d.meta.split||{};
  d.items=Array.isArray(d.items)?d.items:[]; d.del=d.del||{}; return d;
}
function spRecs(d){ const r=d.items.map(o=>['i:'+o.id,o]); r.push(['meta',d.meta]); return r; }
function spMap(d){ const m=new Map(); for(const [k,o] of spRecs(d)) m.set(k,sig(o)); return m; }
function spMerge(L,R){
  L=spMigrate(L); R=spMigrate(R);
  const del=Object.assign({},R.del); for(const k in L.del) del[k]=Math.max(del[k]||0,L.del[k]);
  const pick=(a,b)=>!a?b:!b?a:((b.u||0)>(a.u||0)?b:a);
  const m=new Map(); L.items.forEach(o=>m.set(o.id,o)); R.items.forEach(o=>m.set(o.id,pick(m.get(o.id),o)));
  const items=[...m.values()].filter(o=>!(del['i:'+o.id]>=(o.u||0)));
  const meta=JSON.parse(JSON.stringify(pick(L.meta,R.meta)));
  const mem=new Map();
  [...L.meta.members,...R.meta.members].forEach(x=>{ if(!x||!x.email) return; const p=mem.get(x.email)||{}; mem.set(x.email,Object.assign({},p,x,{name:x.name||p.name||''})); });
  meta.members=[...mem.values()];
  meta.u=Math.max(L.meta.u||0,R.meta.u||0);
  return spMigrate(JSON.parse(JSON.stringify({meta,items,del})));
}
const Spaces={
  _l:null, cache:{},
  list(){ if(!this._l){ try{ this._l=JSON.parse(localStorage.getItem(SPACES_KEY))||[]; }catch(e){ this._l=[]; } } return this._l; },
  saveList(){ try{ localStorage.setItem(SPACES_KEY,JSON.stringify(this._l)); }catch(e){} },
  get(id){ return this.list().find(s=>s.id===id); },
  data(id){
    if(!this.cache[id]){ let d=null; try{ d=JSON.parse(localStorage.getItem('mikakeibo.sp.'+id)); }catch(e){} d=spMigrate(d); this.cache[id]={d,prev:spMap(d)}; }
    return this.cache[id].d;
  },
  setData(id,d){ d=spMigrate(d); this.cache[id]={d,prev:spMap(d)}; this.persist(id); const s=this.get(id); if(s){ s.name=d.meta.name; s.emoji=d.meta.emoji; this.saveList(); } },
  persist(id){ try{ localStorage.setItem('mikakeibo.sp.'+id,JSON.stringify(this.cache[id].d)); }catch(e){ toast('⚠️ No se pudo guardar'); } },
  save(id){
    const c=this.cache[id]; if(!c) return; const now=Date.now(), cur=spMap(c.d); let ch=false;
    for(const [k,o] of spRecs(c.d)) if(c.prev.get(k)!==cur.get(k)){ o.u=now; delete c.d.del[k]; ch=true; }
    for(const k of c.prev.keys()) if(!cur.has(k)){ c.d.del[k]=now; ch=true; }
    c.prev=spMap(c.d); this.persist(id);
    const s=this.get(id); if(s){ s.name=c.d.meta.name; s.emoji=c.d.meta.emoji; if(ch) s.dirty=true; this.saveList(); }
    if(ch) Sync.changed();
  },
  add(entry,d){ this.list().push(entry); this.saveList(); this.setData(entry.id,d); },
  remove(id){ this._l=this.list().filter(s=>s.id!==id); this.saveList(); try{ localStorage.removeItem('mikakeibo.sp.'+id); }catch(e){} delete this.cache[id]; if(ui.space===id) ui.space=null; }
};
const myEmail=()=>Sync.st.email||'';
function spMembers(d){
  const L=d.meta.members.slice(); const me=myEmail();
  if(me && !L.some(m=>m.email===me)) L.unshift({email:me,name:S.settings.myName||''});
  return L;
}
function spName(d,email){ if(email===myEmail()) return 'Tú'; const m=d.meta.members.find(x=>x.email===email); return m&&m.name?m.name:(email||'?').split('@')[0]; }
function spStats(d,ym){
  const it=d.items, ap=it.filter(x=>x.kind==='ap'), g=it.filter(x=>x.kind==='g'), re=it.filter(x=>x.kind==='re');
  const fondo=sum(ap)-sum(g.filter(x=>x.paidBy==='fund'))-sum(re);
  const mem=spMembers(d), totAp=sum(ap);
  const pctOf=e=>{ const v=Number(d.meta.split[e]); return isFinite(v)&&v>0?v:100/Math.max(1,mem.length); };
  const byMember=mem.map(m=>({...m, aporte:sum(ap.filter(x=>x.who===m.email)), meta:pctOf(m.email), debe:sum(g.filter(x=>x.paidBy===m.email))-sum(re.filter(x=>x.to===m.email))}));
  const mg=g.filter(x=>x.date.startsWith(ym)), byCat={}; mg.forEach(x=>byCat[x.cat]=(byCat[x.cat]||0)+x.amount);
  const apMes=sum(ap.filter(x=>x.date.startsWith(ym)));
  return {fondo,byMember,totAp,gastoMes:sum(mg),apMes,byCat,mItems:it.filter(x=>x.date.startsWith(ym))};
}

/* =========================================================
   PAGO QUINCENAL
   - Pagos el 15 y el último día del mes. Si cae sábado, domingo o festivo
     (Colombia), se espera el día hábil anterior.
   - Cada quincena va desde el día que llega el pago hasta el día antes del siguiente.
   - El pago se anota cuando llega (con extras opcionales); el presupuesto
     de la quincena sale de lo que entró de verdad.
   ========================================================= */
const EXTRAS=[{k:'fes',n:'Festivos'},{k:'noc',n:'Nocturnos'},{k:'fds',n:'Fines de semana'},{k:'hex',n:'Horas extra'},{k:'otr',n:'Otros'}];
const isQ = () => S.settings.payMode==='q';
function easterOf(y){
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),
    h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),
    mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;
  return new Date(y,mo-1,da);
}
const _fest={};
function festivos(y){ // festivos de Colombia (Ley Emiliani)
  if(_fest[y]) return _fest[y];
  const set=new Set(), add=d=>set.add(dstr(d));
  const toMon=d=>{ const x=new Date(d), w=x.getDay(); if(w!==1) x.setDate(x.getDate()+((8-w)%7)); return x; };
  [[0,1],[4,1],[6,20],[7,7],[11,8],[11,25]].forEach(([m,d])=>add(new Date(y,m,d)));
  [[0,6],[2,19],[5,29],[7,15],[9,12],[10,1],[10,11]].forEach(([m,d])=>add(toMon(new Date(y,m,d))));
  const e=easterOf(y), off=n=>{ const x=new Date(e); x.setDate(x.getDate()+n); return x; };
  [-3,-2,43,64,71].forEach(n=>add(off(n)));
  return _fest[y]=set;
}
const isBiz = d => { const w=d.getDay(); return w!==0 && w!==6 && !festivos(d.getFullYear()).has(dstr(d)); };
function prevBiz(d){ const x=new Date(d); while(!isBiz(x)) x.setDate(x.getDate()-1); return x; }
function schedDate(key){ const [y,m,q]=key.split('-').map(Number); return dstr(prevBiz(new Date(y,m-1,q===1?15:new Date(y,m,0).getDate()))); }
const pNext = key => { const ym=key.slice(0,7); return key.endsWith('-1') ? ym+'-2' : addMonth(ym,1)+'-1'; };
const pPrev = key => { const ym=key.slice(0,7); return key.endsWith('-2') ? ym+'-1' : addMonth(ym,-1)+'-2'; };
function paysOf(key){
  return mget('pays',()=>{ const m=new Map(); for(const t of S.tx) if(t.type==='pay'){ let a=m.get(t.period); if(!a) m.set(t.period,a=[]); a.push(t); } return m; }).get(key)||[];
}
function pStart(key){ const real=paysOf(key).filter(t=>!t.start).map(t=>t.date).sort(); return real[0]||schedDate(key); }
function pEnd(key){ const n=parseD(pStart(pNext(key))); n.setDate(n.getDate()-1); return dstr(n); }
function periodOf(ds){ const ym=ds.slice(0,7); if(ds>=pStart(ym+'-2')) return ym+'-2'; if(ds>=pStart(ym+'-1')) return ym+'-1'; return addMonth(ym,-1)+'-2'; }
function pName(key){ const m=+key.slice(5,7); return (key.endsWith('-1')?'1.ª':'2.ª')+' quincena de '+MONTHS[m-1]; }
const shortD = ds => { const d=parseD(ds); return d.getDate()+' '+MONTHS[d.getMonth()].slice(0,3); };
// Gastos fijos de un mes; si ese mes aún no se ha planeado, se usan los del último mes planeado (se repiten).
function fixedSource(ym){
  const mo=S.months[ym]; if(mo && (mo.setup || (mo.fixed||[]).length)) return {list:mo.fixed||[], proj:false};
  for(let i=1;i<=6;i++){ const p=S.months[addMonth(ym,-i)]; if(p && (p.fixed||[]).length) return {list:p.fixed, proj:true}; }
  return null;
}
function fixedDate(ym,f){ return f.day ? ym+'-'+pad(Math.min(f.day,daysIn(ym))) : pStart(ym+'-1'); }
function pSaveFor(total){ const s=S.settings; return s.saveMode==='fix' ? Math.min(total,Number(s.saveVal)||0) : Math.round(total*(Number(s.saveVal)||0)/100/100)*100; }
function pStats(key){
  return mget('ps:'+key,()=>{
    const s=pStart(key), e=pEnd(key), inR=t=>t.date>=s && t.date<=e;
    const months=[...new Set([s.slice(0,7), e.slice(0,7)])];
    const tx=[]; months.forEach(ym=>txOfMonth(ym).forEach(t=>{ if(inR(t)) tx.push(t); }));
    const ps=paysOf(key), pago=sum(ps), ahorro=sum(ps,'save'), extras=sum(ps,'extra');
    const fijos=[]; months.forEach(ym=>{ const src=fixedSource(ym); if(src) src.list.forEach(f=>{ const d=fixedDate(ym,f); if(d>=s && d<=e) fijos.push({...f,ym,date:d,paid:src.proj?false:f.paid,proj:src.proj}); }); });
    // Si se empezó a mitad de quincena con "lo que tengo hoy", los fijos anteriores a ese día ya estaban pagados
    const sr=ps.find(p=>p.start); if(sr && !ps.some(p=>!p.start)) for(let i=fijos.length-1;i>=0;i--) if(fijos[i].date<sr.date) fijos.splice(i,1);
    const gastos=tx.filter(isOut), extraIn=sum(tx.filter(t=>t.type==='in'));
    const estimado=!ps.length && (Number(S.settings.payBase)||0)>0;
    const ingBase=ps.length?pago:(estimado?Number(S.settings.payBase):0);
    const ahorroUse=ps.length?ahorro:(estimado?pSaveFor(ingBase):0);
    // Sobrante (o faltante) de la quincena anterior. Si esta quincena empezó con "lo que tengo hoy", no se arrastra nada.

  });
}
function firstPayKey(){ return mget('firstPay',()=>{ let f=null; for(const t of S.tx) if(t.type==='pay' && (!f||t.period<f)) f=t.period; return f; }); }
function sobOf(key){ return mget('sob',()=>{ const m=new Map(); for(const t of S.tx) if(t.type==='sob'){ let a=m.get(t.period); if(!a) m.set(t.period,a=[]); a.push(t); } return m; }).get(key)||[]; }

function vInicio(){
  const ym=ui.month, st=stats(ym), m=st.m, t=todayStr(), isCur=ym===ymOf(t);
  let h='';
  if(isQ()) h+=qTop(); else {
  if(!m.setup){
    const prev=addMonth(ym,-1), pm=S.months[prev];
    h+=`<div class="card hi"><h3>🌱 Planea ${MONTHS[ymParts(ym)[1]-1]}</h3>
      <p class="sm">El Kakeibo empieza antes de gastar: cuánto te entra, qué es fijo y cuánto quieres ahorrar.</p>

      ${pm&&pm.setup?`<button class="btn ghost" data-a="copyPrev">Copiar de ${MONTHS[ymParts(prev)[1]-1]}</button>`:''}</div></div>`;
  }
  const pct = st.disp>0 ? Math.min(100, st.gastado/st.disp*100) : (st.gastado>0?100:0);
  h+=`<div class="card"><div class="between"><span class="mut sm">Te queda para gastar</span>${m.setup?`<button class="link sm" data-a="go" data-t="mes">Editar plan</button>`:''}</div>
    <div class="big ${st.restante<0?'neg':''}">${fmt(st.restante)}</div>
    <div class="bar"><i style="width:${pct}%;background:${pctColor(pct)}"></i></div>
    <div class="sm mut">Gastado ${fmt(st.gastado)} de ${fmt(st.disp)} disponibles</div>
    <div class="kpis"><div><span>Ingresos</span><b>${fmt(st.ing)}</b></div><div><span>Fijos</span><b>${fmt(st.fijos)}</b></div><div><span>Ahorro 🎯</span><b>${fmt(st.ahorro)}</b></div></div>
    ${activeAccs().length?`<div class="xs mut" style="margin-top:8px">💳 En tus cuentas tienes ${fmt(accTotals().mio)}${accTotals().casa?' (+ '+fmt(accTotals().casa)+' para la casa)':''}${!m.setup?' · Planea el mes para saber cuánto puedes gastar':''}</div>`:''}</div>`;

  if(isCur && st.disp>0){
    const dim=daysIn(ym), d=new Date().getDate(), left=dim-d+1;
    const before=sum(st.gastos.filter(x=>x.date<t)), hoy=sum(st.gastos.filter(x=>x.date===t));
    const base=Math.max(0,(st.disp-before)/left), queda=base-hoy;
    const ritmo=st.disp*d/dim, dif=st.gastado-ritmo;
    h+=`<div class="card"><div class="between"><div><div class="mut sm">Hoy puedes gastar</div>
      <div style="font-size:1.6rem;font-weight:800" class="${queda<0?'neg':''}">${fmt(queda)}</div>
      <div class="xs mut">de ${fmt(base)} diarios · quedan ${left} día${left>1?'s':''} del mes</div></div>
      <div style="font-size:2.2rem">${queda<0?'🔥':queda<base*.3?'😬':'😌'}</div></div>
      <p class="sm" style="margin-top:10px">${dif>0?`⚠️ Vas <b>${fmt(dif)}</b> por encima del ritmo ideal del mes.`:`👍 Vas <b>${fmt(-dif)}</b> por debajo del ritmo ideal. ¡Bien!`}</p></div>`;
  }
  }
  h+=creditAlerts();
  h+=accSection();
  // pagos fijos próximos / pendientes
  if(isCur && !isQ()){
    const d=new Date().getDate();
    const pend=m.fixed.filter(f=>!f.paid && f.day && f.day-d<=3).sort((a,b)=>a.day-b.day);
    if(pend.length) h+=`<div class="card warn"><h3>📅 Pagos fijos cerca</h3>${pend.map(f=>`<div class="li"><div class="grow"><b>${esc(f.name)}</b><div class="xs mut">${f.day<d?'Venció el día '+f.day:f.day===d?'Vence hoy':'Vence el día '+f.day}</div></div><span class="amt">${fmt(f.amount)}</span><button class="btn sm" data-a="paid" data-id="${f.id}">Pagado</button></div>`).join('')}</div>`;
  }
  // deseos listos
  const ready=S.wishes.filter(w=>w.status==='wait' && daysBetween(w.created,t)>=(w.days||S.settings.wishDays));
  if(ready.length) h+=`<div class="card hi"><h3>⏳ Ya pasó la espera</h3><p class="sm">${ready.length===1?`Tu deseo <b>${esc(ready[0].name)}</b> está listo para decidir.`:`${ready.length} deseos están listos para decidir.`} ¿Todavía lo quieres?</p><button class="btn sm" data-a="go" data-t="deseos" style="margin-top:6px">Decidir ahora</button></div>`;

  // categorías

      ${b>0?`<div class="xs ${g>b?'neg':'mut'}">${g>b?'Te pasaste por '+fmt(g-b):'Quedan '+fmt(b-g)}</div>`:''}</div></div>`;
  }

    h=`<div class="card warn"><div class="between"><div><b>☁️ Hay cambios sin respaldar</b><div class="xs mut">${ss==='login'?'Google pide que vuelvas a iniciar sesión.':'Toca para guardarlos en tu Drive.'}</div></div><button class="btn sm" data-a="driveSync">Respaldar</button></div></div>`+h;

  return h;
}
function sortTx(a,b){ return a.date<b.date?1:a.date>b.date?-1:(b.ts||0)-(a.ts||0); }
function txRow(t){
  const a=accById(t.acc), an=a?' · '+esc(a.name):'';
  const row=(ic,bg,title,subt,amt,cls)=>`<div class="tx" data-a="edit" data-id="${t.id}"><div class="dot" style="background:${bg}">${ic}</div><div class="grow"><div class="ell"><b class="sm">${title}</b></div><div class="xs mut ell">${subt}</div></div><span class="amt ${cls}">${amt}</span></div>`;
  if(t.type==='tr'){ const to=accById(t.to); return row('↔️','var(--card2)', esc(t.note)||(to&&to.type==='cre'?'Pago de tarjeta':'Movimiento entre cuentas'), `${a?esc(a.name):'?'} → ${to?esc(to.name):'?'} · no es gasto`, fmt(t.amount), 'mut'); }
  if(t.type==='fix') return row('🧾','var(--card2)', esc(t.note)||'Gasto fijo', 'Gasto fijo pagado'+an, '-'+fmt(t.amount), '');

function fillTx(){

  if(ui.accF==='__none') list=list.filter(t=>!t.acc&&t.type!=='tr'); else if(ui.accF) list=list.filter(t=>t.acc===ui.accF||t.to===ui.accF);

  if(!list.length){ el.innerHTML=`<div class="card empty"><i>🫙</i>No hay movimientos con ese filtro en ${monthName(ui.month)}.</div>`; return; }
  const tot=sum(list.filter(isOut));
  let h=`<div class="sm mut" style="margin:4px">${list.length} movimiento${list.length>1?'s':''}${tot?' · gastos '+fmt(tot):''}</div>`;

/* ---------- RESUMEN ---------- */
function weeksOf(ym){
  const [y,m]=ymParts(ym), dim=daysIn(ym), w=[]; let cur=null;
  for(let d=1; d<=dim; d++){ const wd=(new Date(y,m-1,d).getDay()+6)%7; if(!cur||wd===0){ cur={from:d,to:d}; w.push(cur); } cur.to=d; }
  return w;
}
function donut(parts,total){
  const R=60, C=2*Math.PI*R; let off=0;
  const segs=parts.filter(p=>p.v>0).map(p=>{ const len=total?p.v/total*C:0;
    const s=`<circle r="${R}" cx="85" cy="85" fill="none" stroke="${p.color}" stroke-width="22" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 85 85)"/>`; off+=len; return s; }).join('');
  return `<svg viewBox="0 0 170 170" width="170" height="170"><circle r="${R}" cx="85" cy="85" fill="none" stroke="var(--card2)" stroke-width="22"/>${segs}</svg>`;
}
function vResumen(){
  const ym=ui.month, st=stats(ym), pv=stats(addMonth(ym,-1));
  if(!st.tx.length && !st.m.setup) return `<div class="card empty"><i>📊</i>Todavía no hay datos en ${monthName(ym)}.</div>`;
  let h=(isQ()?vQResumen():'')+`<div class="card"><h3>¿En qué se fue la plata?</h3><div class="donutw">${donut(CATS.map(c=>({v:st.byCat[c.id],color:c.color})),st.gastado)}
    <div class="c"><div><div class="xs mut">Gastado</div><b>${fmt(st.gastado)}</b></div></div></div>
    <div class="legend">${CATS.map(c=>`<div><span style="background:${c.color}"></span>${c.name}<br><b>${fmt(st.byCat[c.id])}</b> <span class="mut xs">${st.gastado?Math.round(st.byCat[c.id]/st.gastado*100):0}%</span></div>`).join('')}</div></div>`;

  // balance
  const meta=st.ahorro, real=st.ahorroReal;
  h+=`<div class="card"><h3>Balance del mes</h3>
    <div class="li"><span class="grow">Ingresos</span><b class="pos">${fmt(st.ing)}</b></div>
    <div class="li"><span class="grow">Gastos fijos</span><b>-${fmt(st.fijos)}</b></div>
    <div class="li"><span class="grow">Gastos del mes</span><b>-${fmt(st.gastado)}</b></div>
    <div class="li"><span class="grow"><b>Lo que te queda (ahorro real)</b></span><b class="${real<0?'neg':'pos'}">${fmt(real)}</b></div>
    ${meta?`<p class="sm" style="margin-top:8px">${real>=meta?`🎉 Vas cumpliendo tu meta de ahorro de ${fmt(meta)}.`:`🎯 Para tu meta de ${fmt(meta)} te faltan <b>${fmt(meta-real)}</b>.`}</p>`:''}</div>`;

  // semanas
  const weeks=weeksOf(ym), dim=daysIn(ym);
  h+=`<div class="card"><h3>Semana por semana</h3><p class="xs mut">El presupuesto semanal sale de repartir lo disponible según los días de cada semana.</p>`;
  weeks.forEach((w,i)=>{
    const g=sum(st.gastos.filter(t=>{const d=+t.date.slice(8);return d>=w.from&&d<=w.to;}));
    const b=st.disp>0?st.disp*(w.to-w.from+1)/dim:0, p=b>0?Math.min(100,g/b*100):0;
    h+=`<div style="margin:10px 0"><div class="between sm"><span>Semana ${i+1} <span class="mut xs">(${w.from}–${w.to})</span></span><b>${fmt(g)}${b?` <span class="mut xs">/ ${fmt(b)}</span>`:''}</b></div><div class="bar" style="height:7px"><i style="width:${p}%;background:${pctColor(p)}"></i></div></div>`;
  });
  h+=`</div>`;

  // día a día
  const perDay=Array.from({length:dim},(_,i)=>sum(st.gastos.filter(t=>+t.date.slice(8)===i+1)));
  const mx=Math.max(1,...perDay), avg=st.disp>0?st.disp/dim:0, W=dim*10;
  const bars=perDay.map((v,i)=>`<rect x="${i*10+1.5}" y="${90-v/Math.max(mx,avg)*80}" width="7" height="${v/Math.max(mx,avg)*80}" rx="2" fill="${avg&&v>avg?'var(--warn)':'var(--acc)'}"/>`).join('');
  const avgY=avg?90-avg/Math.max(mx,avg)*80:null;
  h+=`<div class="card"><h3>Día a día</h3><svg viewBox="0 0 ${W} 104" width="100%" preserveAspectRatio="none" style="height:120px">${bars}
    ${avgY!==null?`<line x1="0" x2="${W}" y1="${avgY}" y2="${avgY}" stroke="var(--mut)" stroke-dasharray="3 3" stroke-width="1"/>`:''}
    <text x="0" y="102">1</text><text x="${W/2-5}" y="102">${Math.ceil(dim/2)}</text><text x="${W-12}" y="102">${dim}</text></svg>
    <p class="xs mut">${avg?`Línea punteada: tu límite diario (${fmt(avg)}). En naranja, los días que te pasaste.`:'Planea el mes para ver tu límite diario.'}</p>
    ${st.gastado?`<p class="sm">Día más caro: <b>${perDay.indexOf(mx)+1} de ${MONTHS[ymParts(ym)[1]-1]}</b> (${fmt(mx)})</p>`:''}</div>`;

  // emociones
  if(st.gastado){
    const tm=st.byMood.nec+st.byMood.que+st.byMood.imp;
    h+=`<div class="card"><h3>¿Cómo gastaste?</h3><p class="xs mut">Según lo que marcas al anotar cada gasto.</p>
      ${MOODS.map(md=>{const v=st.byMood[md.id],p=tm?v/tm*100:0;return `<div style="margin:8px 0"><div class="between sm"><span>${md.emoji} ${md.name}</span><b>${fmt(v)} <span class="mut xs">${Math.round(p)}%</span></b></div><div class="bar" style="height:7px"><i style="width:${p}%;background:${md.id==='imp'?'var(--bad)':md.id==='que'?'var(--warn)':'var(--acc)'}"></i></div></div>`}).join('')}
      ${st.byMood.imp>0?`<p class="sm">⚡ Si hubieras evitado los impulsos, tendrías <b>${fmt(st.byMood.imp)}</b> más este mes.</p>`:''}</div>`;
    // top subcategorías
    const subs={}; st.gastos.forEach(t=>{const k=catById(t.cat).emoji+' '+(t.sub||catById(t.cat).name); subs[k]=(subs[k]||0)+t.amount;});
    const top=Object.entries(subs).sort((a,b)=>b[1]-a[1]).slice(0,5);
    h+=`<div class="card"><h3>Top 5 en lo que más gastas</h3>${top.map(([k,v],i)=>`<div class="li"><span class="mut sm">${i+1}.</span><span class="grow sm">${esc(k)}</span><b class="sm">${fmt(v)}</b></div>`).join('')}</div>`;
  }
  // comparación
  if(pv.gastado||pv.ing){
    h+=`<div class="card"><h3>Comparado con ${MONTHS[ymParts(addMonth(ym,-1))[1]-1]}</h3>
      <table class="t"><tr><th>Pilar</th><th>Antes</th><th>Ahora</th><th>Cambio</th></tr>
      ${CATS.map(c=>{const a=pv.byCat[c.id],b=st.byCat[c.id],d=b-a;return `<tr><td>${c.emoji} ${c.name}</td><td>${fmt(a)}</td><td>${fmt(b)}</td><td class="${d>0?'neg':d<0?'pos':''}">${d>0?'▲':d<0?'▼':''} ${fmt(Math.abs(d))}</td></tr>`}).join('')}
      <tr><td><b>Total</b></td><td><b>${fmt(pv.gastado)}</b></td><td><b>${fmt(st.gastado)}</b></td><td class="${st.gastado>pv.gastado?'neg':'pos'}"><b>${fmt(Math.abs(st.gastado-pv.gastado))}</b></td></tr></table></div>`;
  }
  h+=`<button class="btn full ghost" data-a="go" data-t="reflexion" style="margin-bottom:12px">📝 Hacer la reflexión del mes</button>`;
  return h;
}

/* ---------- DESEOS ---------- */
function vDeseos(){
  const t=todayStr(), days=S.settings.wishDays;
  const wait=S.wishes.filter(w=>w.status==='wait'), done=S.wishes.filter(w=>w.status!=='wait');
  const saved=sum(done.filter(w=>w.status==='no'),'price');
  let h=`<div class="card hi"><b>⏳ La regla de los ${days} días</b><p class="sm">¿Te antojaste de algo que no es necesario? Anótalo aquí en vez de comprarlo. Si después de ${days} días todavía lo quieres, cómpralo sin culpa. Si no, te ahorraste esa plata.</p>
    ${saved?`<p class="sm">💪 Llevas <b>${fmt(saved)}</b> ahorrados en ${done.filter(w=>w.status==='no').length} antojo(s) que dejaste pasar.</p>`:''}</div>`;
  h+=`<div class="card"><form data-form="addWish"><div class="grid2"><input class="f" name="name" placeholder="¿Qué quieres?" required><input class="f" name="price" data-money inputmode="numeric" placeholder="$ Precio" required></div><button class="btn full" style="margin-top:8px">Anotar y esperar</button></form></div>`;
  if(wait.length){
    h+=`<div class="card"><h3>En espera</h3>`;
    for(const w of wait.sort((a,b)=>a.created<b.created?-1:1)){
      const d=w.days||days, pas=daysBetween(w.created,t), ready=pas>=d, p=Math.min(100,pas/d*100);
      h+=`<div style="padding:10px 0;border-bottom:1px solid var(--line)"><div class="between"><b class="sm">${esc(w.name)}</b><b class="sm">${fmt(w.price)}</b></div>
        <div class="bar" style="height:6px"><i style="width:${p}%;background:${ready?'var(--ok)':'var(--warn)'}"></i></div>
        ${ready?`<div class="sm">¿Todavía lo quieres?</div><div class="row" style="margin-top:6px"><button class="btn sm" data-a="wishBuy" data-id="${w.id}">Sí, lo compré</button><button class="btn sm ghost" data-a="wishNo" data-id="${w.id}">Ya no lo quiero</button></div>`
        :`<div class="between xs mut"><span>Faltan ${d-pas} día${d-pas>1?'s':''}</span><button class="link xs" data-a="wishNo" data-id="${w.id}">Ya no lo quiero</button></div>`}</div>`;
    }
    h+=`</div>`;
  }
  if(done.length){
    h+=`<div class="card"><h3>Decididos</h3>${done.slice().reverse().slice(0,20).map(w=>`<div class="li"><span class="grow sm">${esc(w.name)}</span><span class="pill ${w.status==='no'?'ok':''}">${w.status==='no'?'Ahorrado':'Comprado'}</span><b class="sm">${fmt(w.price)}</b><button class="del" data-a="delWish" data-id="${w.id}">✕</button></div>`).join('')}</div>`;
  }
  return h;
}

/* ---------- HISTORIAL ---------- */
function vHistorial(){
  const yms=new Set(Object.keys(S.months).filter(k=>S.months[k].setup)); S.tx.forEach(t=>yms.add(ymOf(t.date)));

  if(!list.length) return `<div class="card empty"><i>📚</i>Aquí verás todos tus meses cuando empieces a usar la app.</div>`;
  let tg=0,ta=0;

    return `<tr data-a="openMonth" data-m="${ym}" style="cursor:pointer"><td style="text-transform:capitalize">${monthShort(ym)} ${ym.slice(2,4)}${S.months[ym]?.closed?' 🔒':''}</td><td>${fmt(s.ing)}</td><td>${fmt(s.gastado+s.fijos)}</td><td class="${s.ahorroReal<0?'neg':'pos'}">${fmt(s.ahorroReal)}</td></tr>`; }).join('');
  return `<div class="card"><table class="t"><tr><th>Mes</th><th>Ingresos</th><th>Gastos</th><th>Ahorro</th></tr>${rows}</table><p class="xs mut">Gastos incluye fijos. Toca un mes para abrirlo.</p></div>

}

  return Object.values(map).filter(x=>x.n>=2).sort((a,b)=>b.n-a.n).slice(0,6).map(x=>x.t);
}

      <div class="row" style="justify-content:center;gap:6px;margin:10px 0 16px">${TOUR.map((_,j)=>`<span style="width:${j===i?18:7}px;height:7px;border-radius:9px;background:${j===i?'var(--acc)':'var(--line)'}"></span>`).join('')}</div>
      <div class="grid2">${last?`<button class="btn ghost" data-a="tourPrev">Atrás</button>`:`<button class="btn ghost" data-a="tourEnd">Saltar</button>`}<button class="btn" data-a="${last?'tourEnd':'tourNext'}">${last?'¡Empezar!':'Siguiente'}</button></div></div>`; }
  else if(k==='spx') body=mSpx();
  else if(k==='spnew') body=mSpNew();
  else if(k==='spjoin') body=mSpJoin();
  else if(k==='prompt') body=`<h2 style="margin-bottom:6px">${d.title}</h2>${d.text?`<p class="sm mut">${d.text}</p>`:''}
    <input class="f ${d.money?'money':''}" id="pIn" ${d.money?'data-money inputmode="numeric" placeholder="$ 0"':''} ${d.select?'hidden':''} value="${esc(d.value||'')}">
    ${d.select?`<select class="f" id="pSel">${d.select.map(o=>`<option value="${o.v}">${esc(o.l)}</option>`).join('')}</select>`:''}
    <div class="grid2" style="margin-top:14px"><button class="btn ghost" data-a="closeModal">Cancelar</button><button class="btn ${d.danger?'bad':''}" data-a="promptOk">${d.ok||'Aceptar'}</button></div>`;
  else if(k==='snaps') body=`<div class="between" style="margin-bottom:6px"><h2>Copias semanales</h2><button class="ib" data-a="closeModal">✕</button></div>
    <p class="sm mut">Drive guarda una copia por semana (las 4 últimas). Úsalas si borraste algo por error.</p>
    ${d.files.length?d.files.map(f=>{const n=f.name.replace('semanal-','').replace('.json','').split('-').reverse().join('/');return `<div class="li"><div class="grow"><b class="sm">Semana del ${n}</b><div class="xs mut">${f.size?Math.ceil(f.size/1024)+' KB':''}</div></div><button class="btn sm ghost" data-a="restoreSnap" data-id="${f.id}" data-n="${n}">Restaurar</button></div>`}).join(''):`<div class="empty"><i>🗂️</i>Aún no hay copias semanales.</div>`}`;
  else if(k==='pin') body=`<h2 style="text-align:center">${d.step===2?'Confirma tu PIN':'Elige un PIN de 4 dígitos'}</h2>${pinPad(d.val||'')}<div style="text-align:center;margin-top:10px"><button class="link" data-a="closeModal">Cancelar</button></div>`;
  $('#modal').innerHTML=`<div class="bg" data-a="bgClose"><div class="sheet"><div class="grab"></div>${body}</div></div>`;
}
function closeModal(fromPop){
  if(ui.tmpCash){ const id=ui.tmpCash; ui.tmpCash=null; if(!S.tx.some(t=>t.acc===id||t.to===id)){ S.accounts=S.accounts.filter(a=>a.id!==id); save(); setTimeout(()=>{ if(!ui.modal) render(); },0); } }
  ui.modal=null; ui.form=null; ui.aform=null; ui.sform=null; ui.pform=null; modalCb=null; renderModal();
  if(pendingRender){ pendingRender=false; render(); }
  if(!fromPop){ ignorePop++; history.back(); }
}
function ask(opts,cb){ modalCb=cb; openModal('prompt',opts); }

/* ---------- PIN ---------- */
function pinPad(val){
  return `<div style="display:flex;flex-direction:column;align-items:center;gap:18px;margin-top:14px"><div class="pins" id="pins">${[0,1,2,3].map(i=>`<b class="${i<val.length?'on':''}"></b>`).join('')}</div>
    <div class="pad">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(n=>n===''?'<span></span>':`<button data-a="pinKey" data-v="${n}">${n}</button>`).join('')}</div></div>`;
}
let locked=false, lockVal='', hiddenAt=0;
function showLock(){
  locked=true; lockVal='';
  let el=$('#lock'); if(!el){ el=document.createElement('div'); el.id='lock'; el.className='lock'; document.body.appendChild(el); }
  el.innerHTML=`<div style="font-size:2.6rem">🔒</div><b>Mi Kakeibo</b>${pinPad('')}`;
}
function lockKey(v){
  if(v==='⌫') lockVal=lockVal.slice(0,-1); else if(lockVal.length<4) lockVal+=v;
  const el=$('#lock'); el.querySelector('#pins').outerHTML=`<div class="pins" id="pins">${[0,1,2,3].map(i=>`<b class="${i<lockVal.length?'on':''}"></b>`).join('')}</div>`;
  if(lockVal.length===4){
    if(hash(lockVal)===S.settings.pin){ locked=false; el.remove(); }
    else { const p=el.querySelector('#pins'); p.classList.add('shake'); lockVal=''; setTimeout(()=>{ if($('#lock')) $('#lock').querySelector('#pins').outerHTML=`<div class="pins" id="pins">${'<b></b>'.repeat(4)}</div>`; },380); }
  }
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden) hiddenAt=Date.now();
  else if(S.settings.pin && !locked && Date.now()-hiddenAt>60000 && hiddenAt) showLock();
});

/* ---------- respaldo ---------- */
function fileName(ext){ return 'mi-kakeibo-'+todayStr()+'.'+ext; }
async function shareOrDownload(blob,name){
  try{
    const file=new File([blob],name,{type:blob.type});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:name}); return true; }
  }catch(e){ if(e.name==='AbortError') return false; }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1000); return true;
}
async function doBackup(){
  const data=JSON.stringify({app:'mi-kakeibo',exported:new Date().toISOString(),data:S},null,1);
  const ok=await shareOrDownload(new Blob([data],{type:'application/json'}),fileName('json'));
  if(ok){ S.settings.lastBackup=todayStr(); save(); render(); toast('💾 Respaldo creado'); }
}

  shareOrDownload(new Blob(['﻿'+rows.join('\r\n')],{type:'text/csv'}),fileName('csv'));
}

/* =========================================================
   RESPALDO EN GOOGLE DRIVE (como los backups de WhatsApp)
   - Los datos SIEMPRE se guardan primero en el celular (funciona sin internet).
   - Si conectas tu Drive, se guarda una copia en una carpeta oculta de la app
     dentro de TU Drive. Nadie más la ve; no pasa por ningún servidor.
   - Si hay varios dispositivos con la misma cuenta, los datos se mezclan
     registro por registro (gana el cambio más reciente).
   ========================================================= */
const CLIENT_ID = (window.KAKEIBO_CONFIG && window.KAKEIBO_CONFIG.googleClientId || '').trim();
const SCOPES = 'https://www.googleapis.com/auth/drive.appdata https://www.googleapis.com/auth/drive.file email';
const MAIN_FILE = 'mi-kakeibo.json';
const SYNC_KEY = 'mikakeibo.sync';
const AUTO_EVERY = 6*3600*1000; // al abrir, respalda si pasaron 6 h

function mergeData(L,R){
  const del=Object.assign({}, R.del||{});
  for(const k in (L.del||{})) del[k]=Math.max(del[k]||0, L.del[k]);
  const pick=(a,b)=>!a?b:!b?a:((b.u||0)>(a.u||0)?b:a);
  const col=(name,pre)=>{
    const m=new Map();
    (L[name]||[]).forEach(o=>m.set(o.id,o));
    (R[name]||[]).forEach(o=>m.set(o.id,pick(m.get(o.id),o)));
    return [...m.values()].filter(o=>!(del[pre+o.id]>=(o.u||0)));
  };
  const months={};
  new Set([...Object.keys(L.months||{}),...Object.keys(R.months||{})]).forEach(k=>{
    const o=pick((L.months||{})[k],(R.months||{})[k]);
    if(!(del['m:'+k]>=(o.u||0))) months[k]=o;
  });
  const st=pick(L.settings,R.settings)||{};
  const out={v:1, created:[L.created,R.created].filter(Boolean).sort()[0]||todayStr(),
    settings:Object.assign({}, st, {pin:(L.settings||{}).pin||null, lastBackup:(L.settings||{}).lastBackup||null}),
    months, tx:col('tx','t:'), goals:col('goals','g:'), wishes:col('wishes','w:'), accounts:col('accounts','a:'), del};
  return migrate(JSON.parse(JSON.stringify(out)));
}

const Sync = {
  st:(()=>{ try{ return JSON.parse(localStorage.getItem(SYNC_KEY))||{}; }catch(e){ return {}; } })(),
  busy:false, timer:null, err:'',
  save(){ try{ localStorage.setItem(SYNC_KEY, JSON.stringify(this.st)); }catch(e){} },
  available(){ return !!CLIENT_ID; },
  on(){ return !!this.st.connected; },
  tokenOk(){ return !!this.st.token && Date.now() < (this.st.exp||0)-60000; },
  status(){
    if(!this.on()) return 'off';
    if(this.busy) return 'busy';
    if(this.st.needsLogin) return 'login';
    const dirty=this.st.dirty||Spaces.list().some(s=>s.dirty);
    if(!navigator.onLine) return dirty?'offline':'ok';
    if(this.err) return 'error';
    return dirty?'pending':'ok';
  },
  changed(){
    if(!this.on()) return;
    this.gen=(this.gen||0)+1;
    this.st.dirty=true; this.save(); updateCloud();
    clearTimeout(this.timer); this.timer=setTimeout(()=>this.auto(),4000);
  },
  auto(){ if(this.on() && navigator.onLine && this.tokenOk()) this.run(); },

  // --- inicio de sesión (redirección: funciona en Android y en iPhone instalado) ---
  login(silent){
    if(!this.available()){ toast('Falta configurar el ID de Google en config.js'); return; }
    if(!navigator.onLine){ toast('Necesitas internet para conectar con Drive'); return; }
    const state=uid(); this.st.state=state; if(silent) this.st.lastSilent=Date.now(); this.save();
    const p=new URLSearchParams({client_id:CLIENT_ID, redirect_uri:redirectUri(), response_type:'token', scope:SCOPES, include_granted_scopes:'true', state});
    if(silent){ p.set('prompt','none'); if(this.st.email) p.set('login_hint',this.st.email); }
    else { p.set('prompt','select_account'); if(this.st.email && this.st.needsLogin) p.set('login_hint',this.st.email); }
    showOverlay(silent?'Respaldando en Google Drive':'Abriendo Google');
    // replace: así el botón "atrás" no deja la app a medias
    setTimeout(()=>location.replace('https://accounts.google.com/o/oauth2/v2/auth?'+p.toString()),60);
  },
  handleRedirect(){
    if(!/[#&]state=/.test(location.hash)) return null;
    const h=new URLSearchParams(location.hash.slice(1));
    history.replaceState(null,'',location.pathname+location.search);
    if(!this.st.state || h.get('state')!==this.st.state) return null;
    this.st.state=null;
    if(h.get('access_token')){
      this.st.token=h.get('access_token');
      this.st.exp=Date.now()+(Number(h.get('expires_in'))||3600)*1000;
      const first=!this.st.connected;
      this.st.connected=true; this.st.needsLogin=false; this.err=''; this.save();
      return first?'first':'ok';
    }
    const e=h.get('error');
    if(['interaction_required','login_required','consent_required','account_selection_required'].includes(e)) this.st.needsLogin=true;
    else if(e==='access_denied' && !this.st.connected) setTimeout(()=>toast('Cancelaste la conexión con Drive'),300);
    this.save(); return 'error';
  },
  disconnect(){
    const t=this.st.token;
    if(t && navigator.onLine) fetch('https://oauth2.googleapis.com/revoke?token='+encodeURIComponent(t),{method:'POST'}).catch(()=>{});
    this.st={}; this.save(); this.err=''; updateCloud();
  },

  // --- API de Drive ---
  async api(url,opt={}){
    const r=await fetch(url,Object.assign({},opt,{headers:Object.assign({Authorization:'Bearer '+this.st.token},opt.headers||{})}));
    if(!r.ok){ const e=new Error('Drive respondió '+r.status); e.status=r.status; throw e; }
    return r;
  },
  async list(q){
    const r=await this.api('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&pageSize=100&fields=files(id,name,modifiedTime,size)&q='+encodeURIComponent(q));
    return (await r.json()).files||[];
  },
  async read(id){
    const r=await this.api('https://www.googleapis.com/drive/v3/files/'+id+'?alt=media');
    const buf=new Uint8Array(await r.arrayBuffer());
    let txt;
    if(buf[0]===0x1f && buf[1]===0x8b) txt=await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    else txt=new TextDecoder().decode(buf);
    const j=JSON.parse(txt); return j.data||j;
  },
  // Comprime el respaldo (unas 10-15 veces más liviano). Si el celular no puede, lo sube normal.
  async pack(str){
    try{ if(typeof CompressionStream!=='undefined'){ const gz=await new Response(new Blob([str]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer(); return new Blob([gz],{type:'application/gzip'}); } }catch(e){}
    return new Blob([str],{type:'application/json'});
  },
  async create(name,body,parents=['appDataFolder']){
    const b='mk'+uid(), meta=JSON.stringify(parents?{name,parents}:{name,mimeType:'application/json'});
    const type=(body&&body.type)||'application/json';
    const payload=new Blob([`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${meta}\r\n--${b}\r\nContent-Type: ${type}\r\n\r\n`, body, `\r\n--${b}--`]);
    const r=await this.api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,modifiedTime',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body:payload});
    const j=await r.json(); this._mod=j.modifiedTime||null; return j.id;
  },
  async update(id,body){
    const type=(body&&body.type)||'application/json';
    const r=await this.api('https://www.googleapis.com/upload/drive/v3/files/'+id+'?uploadType=media&fields=id,modifiedTime',{method:'PATCH',headers:{'Content-Type':type},body});
    try{ const j=await r.json(); return j.modifiedTime||null; }catch(e){ return null; }
  },
  async share(id,email,name){
    await this.api('https://www.googleapis.com/drive/v3/files/'+id+'/permissions?sendNotificationEmail=true&emailMessage='+encodeURIComponent('Te invito a nuestro espacio "'+name+'" en Mi Kakeibo. Abre la app, ve a Más › Espacios compartidos › Unirme a uno.'),
      {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({role:'writer',type:'user',emailAddress:email})});
  },
  async syncSpace(sp){
    try{
      const remote=await this.read(sp.fileId), L=Spaces.data(sp.id), before=JSON.stringify(L);
      const M2=spMerge(L,remote); Spaces.setData(sp.id,M2);
      await this.update(sp.fileId, JSON.stringify({app:'mi-kakeibo-espacio',v:1,saved:new Date().toISOString(),data:M2}));
      sp.dirty=false; sp.lastSync=Date.now(); sp.err=''; Spaces.saveList();
      return JSON.stringify(M2)!==before;
    }catch(e){
      if(e.status===401) throw e;
      sp.err=(e.status===404||e.status===403)?'Ya no tienes acceso a este espacio. Pide que te vuelvan a invitar.':(e.message||'Error'); Spaces.saveList(); return false;
    }
  },
  pick(cb){
    const cfg=window.KAKEIBO_CONFIG||{};
    if(!cfg.googleApiKey||!cfg.googleAppId){ toast('Falta poner googleApiKey y googleAppId en config.js'); return; }
    if(!navigator.onLine){ toast('Necesitas internet'); return; }
    if(!this.tokenOk()){ toast('Conectando con Google… vuelve a tocar el botón al regresar'); setTimeout(()=>this.login(!!this.st.email),900); return; }
    const open=()=>{
      const view=new google.picker.DocsView(google.picker.ViewId.DOCS).setMimeTypes('application/json').setQuery('Mi Kakeibo');
      new google.picker.PickerBuilder().addView(view).setOAuthToken(this.st.token).setDeveloperKey(cfg.googleApiKey).setAppId(String(cfg.googleAppId))
        .setLocale('es').setTitle('Elige el espacio que te compartieron')
        .setCallback(data=>{ if(data.action===google.picker.Action.PICKED && data.docs && data.docs[0]) cb(data.docs[0].id); })
        .build().setVisible(true);
    };
    if(window.google && google.picker) return open();
    const sc=document.createElement('script'); sc.src='https://apis.google.com/js/api.js';
    sc.onload=()=>gapi.load('picker',open); sc.onerror=()=>toast('No se pudo cargar Google Drive'); document.head.appendChild(sc);
  },
  async remove(id){ await this.api('https://www.googleapis.com/drive/v3/files/'+id,{method:'DELETE'}); },
  async whoami(){ try{ const r=await this.api('https://www.googleapis.com/oauth2/v3/userinfo'); const j=await r.json(); if(j.email){ this.st.email=j.email; this.save(); } }catch(e){} },
  body(data){ return JSON.stringify({app:'mi-kakeibo', v:1, saved:new Date().toISOString(), data}); },

  // --- sincronizar: bajar, mezclar, subir ---
  async run(manual){
    if(this.busy) return;
    if(!navigator.onLine){ if(manual) toast('📴 Sin internet. Se respalda solo cuando vuelva la conexión.'); updateCloud(); return; }
    if(!this.tokenOk()){ if(manual) this.login(!this.st.needsLogin && !!this.st.email); return; }
    this.busy=true; updateCloud(); const g0=this.gen||0;
    try{
      if(!this.st.email) await this.whoami();
      const files=(await this.list(`name='${MAIN_FILE}'`)).sort((a,b)=>a.modifiedTime<b.modifiedTime?1:-1);
      // Si el archivo de Drive es el mismo que subimos la última vez, no hace falta bajarlo
      const same=files.length===1 && this.st.remoteMod && files[0].modifiedTime===this.st.remoteMod;
      let fromRemote=false;
      if(!same && files.length){
        const before=JSON.stringify(S); let merged=S;
        for(const f of files) merged=mergeData(merged, await this.read(f.id));
        fromRemote=JSON.stringify(merged)!==before;
        S=merged; prevMap=buildMap(S); persist();
      }
      const body=await this.pack(this.body(S));
      if(files.length){ this.st.remoteMod=await this.update(files[0].id, body); for(const f of files.slice(1)) await this.remove(f.id); }
      else { await this.create(MAIN_FILE, body); this.st.remoteMod=this._mod; }
      await this.weekly(body);
      let spCh=false;
      for(const sp of Spaces.list()) spCh=(await this.syncSpace(sp))||spCh;
      const raced=(this.gen||0)!==g0; // hubo cambios mientras subía: se vuelve a subir
      this.st.dirty=raced; this.st.lastSync=Date.now(); this.err='';
      if(raced){ Spaces.list().forEach(x=>x.dirty=true); Spaces.saveList(); setTimeout(()=>this.auto(),1500); }
      S.settings.lastBackup=todayStr(); persist(new Set());
      if(fromRemote||spCh) softRender();
      if(manual) toast('☁️ Respaldado en tu Google Drive');
    }catch(e){
      console.error(e);
      if(e.status===401||e.status===403){ this.st.token=null; this.err=''; if(manual) this.login(!!this.st.email); }
      else { this.err=e.message||'Error'; if(manual) toast('⚠️ No se pudo respaldar: '+this.err); }
    }finally{ this.busy=false; this.save(); updateCloud(); }
  },
  async weekly(body){ // una copia por semana, se guardan las 4 últimas
    const wk=mondayOf(todayStr()); if(this.st.lastWeek===wk) return;
    const all=(await this.list("name contains 'semanal-'")).sort((a,b)=>a.name<b.name?1:-1);
    if(!all.some(f=>f.name==='semanal-'+wk+'.json')){ await this.create('semanal-'+wk+'.json', body); all.unshift({name:'semanal-'+wk+'.json'}); }
    for(const f of all.slice(4)) if(f.id) await this.remove(f.id);
    this.st.lastWeek=wk;
  },
  async snaps(){
    if(!navigator.onLine){ toast('Necesitas internet'); return; }
    if(!this.tokenOk()){ this.login(!!this.st.email); return; }
    try{
      const files=(await this.list("name contains 'semanal-'")).sort((a,b)=>a.name<b.name?1:-1);
      openModal('snaps',{files});
    }catch(e){ toast('⚠️ No se pudo leer Drive'); }
  },
  async restoreSnap(id){
    try{
      const d=await this.read(id); if(!d || !Array.isArray(d.tx)) throw new Error('formato');
      const pin=S.settings.pin, now=Date.now();
      S=migrate(d); S.settings.pin=pin; S.del={};
      for(const [,o] of recordsOf(S)) o.u=now; // esta copia pasa a ser la más reciente
      prevMap=buildMap(S); persist();
      const files=await this.list(`name='${MAIN_FILE}'`);
      const packed=await this.pack(this.body(S));
      if(files.length) this.st.remoteMod=await this.update(files[0].id, packed); else { await this.create(MAIN_FILE, packed); this.st.remoteMod=this._mod; }
      this.st.dirty=false; this.st.lastSync=Date.now(); this.save();
      closeModal(); ui.stack=[]; ui.tab='inicio'; render(); toast('✅ Copia restaurada');
    }catch(e){ toast('⚠️ No se pudo restaurar'); }
  },

  // --- al abrir la app ---
  boot(){
    const r=this.handleRedirect();
    if(r==='first'){ setTimeout(()=>toast('☁️ Drive conectado. Respaldando…'),200); }
    if(!this.on()) return false;
    if(this.tokenOk()){ setTimeout(()=>this.run(r==='first'),300); return false; }
    // sin token vigente: redirección rápida y silenciosa a Google si hace falta respaldar
    const need=this.st.dirty || Spaces.list().some(s=>s.dirty) || !this.st.lastSync || Date.now()-this.st.lastSync>AUTO_EVERY;
    const tooSoon=Date.now()-(this.st.lastSilent||0) < 10*60000;
    if(need && navigator.onLine && !this.st.needsLogin && !tooSoon && this.st.email && S.settings.autoDrive!==false && r===null){ this.login(true); return true; }
    return false;
  }
};

const CLOUD = {
  off:['☁️','Sin respaldo en Drive'], ok:['✅','Respaldado'], busy:['🔄','Respaldando…'], pending:['⏳','Cambios por respaldar'],
  offline:['📴','Sin internet: se respalda al volver'], login:['⚠️','Toca para volver a conectar Drive'], error:['⚠️','Hubo un error al respaldar']
};

function ago(ms){
  if(!ms) return 'nunca';
  const m=Math.round((Date.now()-ms)/60000);
  if(m<1) return 'hace un momento'; if(m<60) return 'hace '+m+' min';
  const h=Math.round(m/60); if(h<24) return 'hace '+h+' h';
  const d=Math.round(h/24); return 'hace '+d+' día'+(d>1?'s':'');
}

  const s=Sync.status();

}

/* ---------- actualizaciones ----------
   En iPhone la app casi nunca se "reabre": iOS solo la despierta. Por eso se revisa la versión
   publicada al volver a la app y con el botón de Más. Los datos nunca se tocan. */
const verNum = v => String(v||'0').split('.').reduce((a,n)=>a*1000+(parseInt(n)||0),0);
async function remoteVersion(){
  const r=await fetch('index.html?v='+Date.now(),{cache:'no-store'}); if(!r.ok) throw new Error('http '+r.status);
  const m=(await r.text()).match(/APP_VERSION = '([^']+)'/); return m?m[1]:null;
}
function showUpdateBar(v){
  if($('.upbar')) return;
  const b=document.createElement('div'); b.className='upbar';
  b.innerHTML=`<span class="grow sm"><b>✨ Hay una versión nueva${v?' ('+esc(v)+')':''}</b><br>Tus datos se conservan.</span><button class="btn sm" style="background:var(--accT);color:var(--acc)" data-a="doUpdate">Actualizar</button>`;
  document.body.appendChild(b);
}
async function hardUpdate(){
  if(!navigator.onLine){ toast('📴 Necesitas internet para actualizar'); return; }
  showOverlay('Actualizando Mi Kakeibo');
  try{
    const regs=(navigator.serviceWorker && navigator.serviceWorker.getRegistrations)?await navigator.serviceWorker.getRegistrations():[];
    for(const r of regs) await r.update().catch(()=>{});
    if(window.caches){ const ks=await caches.keys(); await Promise.all(ks.map(k=>caches.delete(k))); } // solo la copia de la app, no los datos
  }catch(e){}
  location.reload();
}
async function autoCheckUpdate(){
  if(!navigator.onLine || $('.upbar')) return;
  try{ const v=await remoteVersion(); if(v && verNum(v)>verNum(APP_VERSION)) showUpdateBar(v); }catch(e){}
}
let lastHide=0;
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ lastHide=Date.now(); return; }
  if(lastHide && Date.now()-lastHide>30*60000) autoCheckUpdate();
});
setTimeout(autoCheckUpdate,5000);
navigator.storage?.persist?.().catch(()=>{});
</script>
